; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================================
; Pololu 3pi+ 32U4 Robot Firmware
; ============================================================================
[env:pololu-3pi]
platform = atmelavr
board = a-star32U4
framework = arduino
lib_deps = 
    pololu/Pololu3piPlus32U4@^1.1.3
monitor_speed = 115200
build_src_filter = +<*> -<esp32/>

; ============================================================================
; ESP32-S3-WROOM-1 WiFi Bridge
; ============================================================================
[env:esp32-wifi-bridge]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
framework = arduino
lib_deps = 
    bblanchon/ArduinoJson@^7.0.0
lib_extra_dirs = 
    ../esp-transiver-util-lib
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<esp32/esp32_bridge.cpp>
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DESP32_S3_BRIDGE

; ============================================================================
; ESP32-C3 SuperMini (HW-466AB) WiFi Bridge
; Smaller/cheaper alternative to ESP32-S3
; ============================================================================
[env:esp32c3-wifi-bridge]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
framework = arduino
lib_deps = 
    bblanchon/ArduinoJson@^7.0.0
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<esp32/esp32c3_bridge.cpp>
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DESP32_C3_BRIDGE
